name: CI
permissions:
  contents: read

# Pull requests, and the default branch.
#
# ## Two corrections, both measured
#
# This read `branches: [main]` on *both* triggers, and **this repository had no
# `main` branch** — its default was the working branch itself. Neither trigger
# could ever match, so CI had never run once since the fork. Tahap 53 opened
# both filters to fix that, and created `main` so the PR flow had a base.
#
# Opening both was too much. `push` and `pull_request` both match a PR branch,
# and their `concurrency` groups differ — `refs/heads/<branch>` against
# `refs/pull/<n>/merge` — so neither cancels the other and **both run in full**.
# Observed on PR #9: every push started two complete suites, and each new push
# cancelled the previous pair before the slower `e2e` job could finish, so the
# e2e job never completed at all.
#
# So: pull requests are covered by `pull_request` (one run per push, whatever
# the branch is called), and `main` is covered for the post-merge case. A
# branch with no open PR gets no CI — which is the standard trade and the
# reason to open the PR early.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ## Why Sanity configuration is in this file, and why only on two steps
#
# The first `e2e` job that ever ran to completion (PR #9, head `8f2493f`)
# reported **424 passed / ~60 failed**, and every single failure was
# content-dependent: `/en/work` rendered nothing, `/en/work/<slug>` 404'd,
# `/en/practice/<v>` had no plates, plus `journey`, `first-screen`,
# `navigation-landing` and `reading-progress`. The runner had no Sanity
# configuration, so `app/[locale]/work/page.tsx` called `notFound()` and the
# rest rendered empty. The gates were not wrong; the runner had no site to
# measure.
#
# These three values are **already public**. They carry the `NEXT_PUBLIC_`
# prefix, which means Next.js inlines them into the client bundle — the
# shipped HTML of every page already contains
# `cdn.sanity.io/images/az53j4l1/production/...`. Putting them in a workflow
# file publishes nothing that visiting the site does not.
#
# And the dataset is world-readable: `count(*[_type=="project"])` against
# `https://az53j4l1.api.sanity.io/.../data/query/production` with **no**
# Authorization header returns HTTP 200 and `6`. So CI needs no token to read
# published content, and gets none. `SANITY_API_WRITE_TOKEN` is deliberately
# absent and must stay absent: it carries developer+editor roles, it lives
# only in a gitignored `.env.local`, it must never be given a `NEXT_PUBLIC_`
# prefix, and CI has no business writing anything.
#
# ## Only on the steps that render pages — this was learned the hard way
#
# The first attempt put these at workflow level, so they reached **every**
# step, including `bun run check`. That turned one unit test red:
# `buildMarkdownDocument > returns a recoverable Markdown 404`. The cause is
# worth writing down, because it is not a flake and not a network problem:
#
#   Cross-Origin Request Blocked: The Same Origin Policy disallows reading
#   the remote resource at "https://az53j4l1.apicdn.sanity.io/..."
#     at happy-dom/lib/xml-http-request/XMLHttpRequest.js
#     at @sanity/client/dist/index.browser.js
#
# `lib/scripts/test-setup.ts` registers happy-dom globals and restores Bun's
# native `fetch`, but **not** `XMLHttpRequest` — and `@sanity/client`'s
# browser build reaches for XHR, which happy-dom refuses cross-origin. Five
# retries, then a throw, then `fetchCmsRoutesResult` degrades, and a degraded
# catalogue answers 503 instead of 404.
#
# The unit suite is hermetic on a developer machine too, and that is not an
# accident of configuration: `bun test` does not load `.env.local`, so
# `isConfigured('sanity')` is `false` there. Measured —
# `getCmsRoutesResult()` under the real preload returns
# `degraded=false, routes=0` in 1ms. CI now matches that, so the unit suite
# reaches no network at all and the two environments agree.

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # test:oxlint-plugin (run via `bun run check`) invokes `node` directly on
      # each ruletest file, so the runner's node must meet the engines floor
      # (>=24.20.0, the current LTS; native type-stripping of .ts files is unflagged).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      # Build first: generates next-env.d.ts + .next/types (gitignored) that
      # tsc needs, and catches RSC/prerender regressions before deploy.
      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: az53j4l1
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2025-03-01'
        run: bun run build

      # Separate from `check` purely for the --format=github annotations, which
      # surface findings inline on the PR diff. `check` re-runs oxlint anyway.
      - name: Lint
        run: bun oxlint --format=github --max-warnings=0

      - name: Run checks
        run: bun run check

      # Advisory — a starter intentionally exports things nothing imports (see
      # doctor.config.ts's deadCode note), so findings here are signal for
      # humans to review, not a merge gate.
      - name: deslop (advisory)
        continue-on-error: true
        run: bun run deslop

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the gate below can diff against the PR base branch.
          fetch-depth: 0

      # `e2e` is a REQUIRED branch-protection check, so this job must always
      # report a conclusion — it may skip its expensive body, it must never be
      # skipped at trigger level. This is why the gate lives HERE, as a step,
      # rather than as a `paths:`/`paths-ignore:` filter on the workflow
      # trigger: a trigger-level filter would leave the required `e2e` check
      # stuck as "expected" forever on any PR that doesn't touch a matched
      # path, permanently blocking merge.
      #
      # Semantics: a conservative SKIP-list, not a run-list — defaults to run.
      #   - `push` (main): always run. Post-merge safety beats savings.
      #   - `pull_request`: diff against the merge-base; run unless EVERY
      #     changed file is one that cannot affect a rendered page. A change
      #     to this workflow file itself always forces a run, so the gate
      #     proves itself on the PR that edits it.
      - name: Decide whether UI could have changed
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the base explicitly instead of trusting the checkout to have
          # created origin/<base> — a fork that trims fetch-depth for checkout
          # speed would otherwise hit "unknown revision" here, and under the
          # runner's bash -e that turns a docs-only PR's required check red.
          # Any failure in the pipeline fails OPEN: e2e runs.
          if ! git fetch --quiet origin -- "${{ github.base_ref }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files=$(git diff --name-only "FETCH_HEAD...HEAD"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed_files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/ci.yml)
                run=true
                ;;
              *.md | docs/* | plans/* | .claude/* | .cursor/* | .vscode/* | .github/* | LICENSE | .editorconfig | .gitattributes | .gitignore | lefthook.yml | SECURITY.md)
                # Safe — cannot affect a rendered page.
                ;;
              *)
                run=true
                ;;
            esac
          done <<<"$changed_files"

          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # This job runs its own `next build` (playwright.config.ts webServer in
      # CI), so it needs the same .next/cache step as the ci job — that path
      # includes Turbopack's persistent build cache (.next/cache/turbopack).
      - name: Cache Next.js build
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts boots the prod server itself in CI (webServer),
      # so no separate server step is needed here.
      # `e2e/storybook-a11y.e2e.ts` reads `storybook-static/` and **skips with a
      # message** when it is absent — about a hundred story-level axe checks
      # that report success by not running. Its own doc comment says "CI runs
      # `bun run build-storybook` first"; this job did not, so that sentence
      # was false for as long as it existed. It is true now.
      - name: Build Storybook
        if: steps.gate.outputs.run == 'true'
        run: bun run build-storybook

      # `playwright.config.ts` boots its own `next build && next start` here,
      # so this is the step the site's content has to reach.
      - name: Run e2e tests
        if: steps.gate.outputs.run == 'true'
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: az53j4l1
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2025-03-01'
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Report gate result
        if: steps.gate.outputs.run != 'true'
        run: echo 'e2e skipped, no UI-affecting changes'
