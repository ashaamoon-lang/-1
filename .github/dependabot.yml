# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Patch/minor bumps that pass the Test workflow are auto-merged by
# .github/workflows/automerge-dependabot.yml. Major bumps stay open
# for human review.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  # npm / bun deps: DELIBERATELY ABSENT. Measured 2026-09-12 (Tahap 61).
  #
  # Dependabot raises ten PRs a week here and every one of them failed CI at
  # the same step, for the same reason, and none of them was about the
  # dependency:
  #
  #     error: lockfile had changes, but lockfile is frozen
  #
  # Dependabot bumps package.json but cannot regenerate `bun.lock`, and CI
  # installs with `--frozen-lockfile`. `.github/workflows/dependabot-lockfile.yml`
  # exists to close that gap and stays inert until someone adds a
  # `DEPENDABOT_PAT` Dependabot secret (its own header explains the one-time
  # setup). Until then the ecosystem produces nothing but red checks — and a CI
  # that is always red trains everyone to stop reading it, which is the most
  # expensive gate to lose.
  #
  # So npm updates are done by hand instead: `bun update`, then the full gate
  # suite, then one commit. Re-enable this block the same day the PAT is set,
  # not before.
